        <!-- Contact Form -->
       <div class="row">
            <div class="col-md-8">
                <h3>Send us a Message</h3>
                <form name="sentMessage" id="contactForm" method="post" novalidate>
                    <div class="mb-3">
                        <div class="controls">
                            <label>Your Name:</label>
                            <input type="text" class="form-control" name="name" id="name" required data-validation-required-message="Please enter your name.">
                            <p class="help-block"></p>
                        </div>
                    </div>
                   <div class="mb-3">
                        <div class="controls">
                            <label>Your Email Address:</label>
                            <input type="email" class="form-control" name="email" id="email" required data-validation-required-message="Please enter your email address.">
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="controls">
                            <label>Message:</label>
                            <textarea rows="10" cols="100" class="form-control" name="message" id="message" required data-validation-required-message="Please enter your message" maxlength="999" style="resize:none"></textarea>
                        </div>
                    </div>
                    <div id="success"></div>
                    <!-- For success/fail messages -->
                    <button type="submit" class="btn btn-primary" onclick="return sendcontactmsg();">Send Message</button>
                </form>
            </div>

        </div>
	<script>
	function sendcontactmsg()
	{
	   if ($("#message").val() == "")
	   {
	       alert("please write a message")
	       return false;
	   }
	
	   if ($("#email").val() == "")
	   {
	       alert("please enter your email")
	       return false;
	   }

	   if ($("#name").val() == "")
	   {
	       alert("please enter your name")
	       return false;
	   }
	   alert("Thank you for your message, We will get back to you promptly");
	   return true;
	}
	</script>
        <!-- /.row -->
