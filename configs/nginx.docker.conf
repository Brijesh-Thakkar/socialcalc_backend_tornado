worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    gzip on;
    gzip_min_length  1000;
    gzip_proxied     any;
    gzip_types text/plain text/css application/javascript
               application/json application/xml text/javascript;

    # --- Upstream: two Tornado app containers (round-robin by default) ---
    upstream tornado_app {
        server app1:8888;
        server app2:8888;
        keepalive 32;
    }

    # Map the Upgrade header for WebSocket proxying
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # Only retry on hard errors, not timeouts — prevents cascading failures
        proxy_next_upstream error;

        # Proxy timeouts suitable for long-lived connections
        proxy_connect_timeout  10s;
        proxy_send_timeout     300s;
        proxy_read_timeout     300s;
        send_timeout           300s;

        # Common proxy headers applied to every proxied location
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Scheme          $scheme;
        proxy_pass_header  Server;
        proxy_redirect     off;

        # HTTP/1.1 required for keepalive to upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # ----------------------------------------------------------------
        # WebSocket upgrade path: /updates  (long-poll / WS endpoint)
        # ----------------------------------------------------------------
        location /updates {
            proxy_pass http://tornado_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }

        # ----------------------------------------------------------------
        # WebSocket upgrade path: /broadcast
        # ----------------------------------------------------------------
        location /broadcast {
            proxy_pass http://tornado_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }

        # ----------------------------------------------------------------
        # WebSocket upgrade path: /collaborate
        # ----------------------------------------------------------------
        location /collaborate {
            proxy_pass http://tornado_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }

        # ----------------------------------------------------------------
        # All other application routes — proxy to Tornado upstream
        # ----------------------------------------------------------------
        location / {
            proxy_pass http://tornado_app;
        }
    }
}
