name: E2E Tests

on:
  push:
    branches: [py3-tornado6-upgrade]
  pull_request:
    branches: [py3-tornado6-upgrade, main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The fastapi-interop sidecar source (docker-compose.yml: FASTAPI_INTEROP_CONTEXT) lives in a
      # private repo, so the checkout needs FASTAPI_REPO_TOKEN (fine-grained PAT, Contents: read on
      # seetadev/touch-calc-fastapi-backend-libp2p-testing). Without it the E2E job is skipped
      # with a warning instead of failing on "Repository not found".
      - name: Check for FASTAPI_REPO_TOKEN
        id: fastapi
        env:
          FASTAPI_REPO_TOKEN: ${{ secrets.FASTAPI_REPO_TOKEN }}
        run: |
          if [ -n "$FASTAPI_REPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=E2E skipped::FASTAPI_REPO_TOKEN secret is not set, so the private repo seetadev/touch-calc-fastapi-backend-libp2p-testing cannot be checked out and the E2E tests did not run."
          fi

      - name: Checkout fastapi-interop sidecar source
        if: steps.fastapi.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: seetadev/touch-calc-fastapi-backend-libp2p-testing
          ref: main
          token: ${{ secrets.FASTAPI_REPO_TOKEN }}
          path: fastapi-interop-src

      - name: Set up Docker Buildx
        if: steps.fastapi.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and start Docker Compose stack
        if: steps.fastapi.outputs.available == 'true'
        run: |
          cp .env.example .env
          # Override with CI-safe values
          sed -i 's/generate_a_random_secret_here/ci-test-cookie-secret-not-real/g' .env
          echo "FASTAPI_INTEROP_CONTEXT=./fastapi-interop-src" >> .env
          # short sidecar timeouts so the 504 test does not wait for the 60 s / 120 s defaults
          sed -i 's/^INTEROP_IMPORT_TIMEOUT=.*/INTEROP_IMPORT_TIMEOUT=8/; s/^INTEROP_EXPORT_TIMEOUT=.*/INTEROP_EXPORT_TIMEOUT=8/' .env
          cp meshkit-service/.env.example meshkit-service/.env
          cp meshkit-sidecar/.env.example meshkit-sidecar/.env
          # Point meshkit-sidecar at the MinIO service already in docker-compose
          sed -i 's/^MESHKIT_ACCESS_KEY=.*/MESHKIT_ACCESS_KEY=minioadmin/' meshkit-sidecar/.env
          sed -i 's/^MESHKIT_SECRET_KEY=.*/MESHKIT_SECRET_KEY=minioadmin/' meshkit-sidecar/.env
          sed -i 's/^MESHKIT_BUCKET=.*/MESHKIT_BUCKET=mc2-app-storage-useast1/' meshkit-sidecar/.env
          sed -i 's|^MESHKIT_ENDPOINT=.*|MESHKIT_ENDPOINT=http://minio:9000|' meshkit-sidecar/.env
          docker compose up -d --build
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Wait for application to be healthy
        if: steps.fastapi.outputs.available == 'true'
        run: |
          echo "Waiting for nginx to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/login > /dev/null 2>&1; then
              echo "Application is ready after ${i}s"
              exit 0
            fi
            echo "Attempt ${i}/30 — waiting..."
            sleep 2
          done
          echo "Application failed to start"
          docker compose logs
          exit 1

      - name: Set up Node.js
        if: steps.fastapi.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.fastapi.outputs.available == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.fastapi.outputs.available == 'true'
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        if: steps.fastapi.outputs.available == 'true'
        run: npx playwright test --reporter=list,html
        env:
          BASE_URL: http://localhost:8080
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() && steps.fastapi.outputs.available == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Show Docker Compose logs on failure
        if: failure() && steps.fastapi.outputs.available == 'true'
        run: docker compose logs

      - name: Stop Docker Compose
        if: always() && steps.fastapi.outputs.available == 'true'
        run: docker compose down
