name: E2E Tests

on:
  push:
    branches: [py3-tornado6-upgrade]
  pull_request:
    branches: [py3-tornado6-upgrade, main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # One explicit compose project for every docker compose call and for the specs that
      # docker exec into containers (docker.spec.ts, nginx.spec.ts read it), instead of relying
      # on the checkout directory name (socialcalc_backend_tornado) matching their default.
      COMPOSE_PROJECT_NAME: tornado_e2e
      # Source of the socialcalc-ai image (docker-compose.yml: SOCIALCALC_AI_CONTEXT). The Dockerfile lives on
      # branch feature/docker of aspiringsdgs/socialcalc-ai (PR #4).
      # TODO: switch SOCIALCALC_AI_REF to main once that PR (and PR #3 under it) is merged.
      SOCIALCALC_AI_REPO: aspiringsdgs/socialcalc-ai
      SOCIALCALC_AI_REF: feature/docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The fastapi-interop sidecar source (docker-compose.yml: FASTAPI_INTEROP_CONTEXT) lives in the
      # private repo seetadev/touch-calc-fastapi-backend-libp2p-testing, so the checkout needs the
      # FASTAPI_REPO_TOKEN secret (PAT with read access to it).
      # - pushes and same-repo PRs: the token is required; without it the job fails.
      # - fork PRs (GitHub does not pass secrets to them): the stack runs without the sidecar
      #   (.github/ci/compose.no-fastapi-interop.yml) and only interop-fastapi.spec.ts is left out.
      - name: Decide whether the fastapi-interop sidecar can be built
        id: fastapi
        env:
          FASTAPI_REPO_TOKEN: ${{ secrets.FASTAPI_REPO_TOKEN }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "$FASTAPI_REPO_TOKEN" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK_PR" = "true" ]; then
            echo "mode=no-interop" >> "$GITHUB_OUTPUT"
            echo "COMPOSE_FILE=docker-compose.yml:.github/ci/compose.no-fastapi-interop.yml:.github/ci/compose.no-socialcalc-ai.yml" >> "$GITHUB_ENV"
            echo "::warning title=fastapi-interop and socialcalc-ai not tested::Fork PR without FASTAPI_REPO_TOKEN: the fastapi-interop sidecar, the socialcalc-ai UI service and tests/e2e/interop-fastapi.spec.ts + tests/e2e/socialcalc-ai.spec.ts are skipped; all other E2E tests run."
          else
            echo "::error title=FASTAPI_REPO_TOKEN missing::The FASTAPI_REPO_TOKEN Actions secret is not set. It is required to check out the private repo seetadev/touch-calc-fastapi-backend-libp2p-testing (fastapi-interop sidecar) for pushes and same-repo PRs."
            exit 1
          fi

      - name: Checkout fastapi-interop sidecar source
        if: steps.fastapi.outputs.mode == 'full'
        uses: actions/checkout@v4
        with:
          repository: seetadev/touch-calc-fastapi-backend-libp2p-testing
          ref: main
          token: ${{ secrets.FASTAPI_REPO_TOKEN }}
          path: fastapi-interop-src

      # The socialcalc-ai UI image is built from its own repo, checked out with the same token.
      # Fork PRs (no secrets) skip only this service, see compose.no-socialcalc-ai.yml.
      - name: Checkout socialcalc-ai source
        if: steps.fastapi.outputs.mode == 'full'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOCIALCALC_AI_REPO }}
          ref: ${{ env.SOCIALCALC_AI_REF }}
          token: ${{ secrets.FASTAPI_REPO_TOKEN }}
          path: socialcalc-ai-src

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start Docker Compose stack
        run: |
          cp .env.example .env
          # Override with CI-safe values
          sed -i 's/generate_a_random_secret_here/ci-test-cookie-secret-not-real/g' .env
          if [ "${{ steps.fastapi.outputs.mode }}" = "full" ]; then
            echo "FASTAPI_INTEROP_CONTEXT=./fastapi-interop-src" >> .env
            echo "SOCIALCALC_AI_CONTEXT=./socialcalc-ai-src" >> .env
            # short UI-proxy read timeout so the 504 test does not wait for the 60 s default
            sed -i 's/^SOCIALCALC_AI_READ_TIMEOUT=.*/SOCIALCALC_AI_READ_TIMEOUT=5/' .env
          fi
          # short sidecar timeouts so the 504 test does not wait for the 60 s / 120 s defaults
          sed -i 's/^INTEROP_IMPORT_TIMEOUT=.*/INTEROP_IMPORT_TIMEOUT=8/; s/^INTEROP_EXPORT_TIMEOUT=.*/INTEROP_EXPORT_TIMEOUT=8/' .env
          cp meshkit-service/.env.example meshkit-service/.env
          cp meshkit-sidecar/.env.example meshkit-sidecar/.env
          # Point meshkit-sidecar at the MinIO service already in docker-compose
          sed -i 's/^MESHKIT_ACCESS_KEY=.*/MESHKIT_ACCESS_KEY=minioadmin/' meshkit-sidecar/.env
          sed -i 's/^MESHKIT_SECRET_KEY=.*/MESHKIT_SECRET_KEY=minioadmin/' meshkit-sidecar/.env
          sed -i 's/^MESHKIT_BUCKET=.*/MESHKIT_BUCKET=mc2-app-storage-useast1/' meshkit-sidecar/.env
          sed -i 's|^MESHKIT_ENDPOINT=.*|MESHKIT_ENDPOINT=http://minio:9000|' meshkit-sidecar/.env
          docker compose up -d --build
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Wait for application to be healthy
        run: |
          echo "Waiting for nginx to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/login > /dev/null 2>&1; then
              echo "Application is ready after ${i}s"
              exit 0
            fi
            echo "Attempt ${i}/30 — waiting..."
            sleep 2
          done
          echo "Application failed to start"
          docker compose logs
          exit 1

      - name: Wait for the socialcalc-ai UI to be healthy
        if: steps.fastapi.outputs.mode == 'full'
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/healthz > /dev/null 2>&1; then
              echo "socialcalc-ai is ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "socialcalc-ai failed to start"
          docker compose logs socialcalc-ai
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: |
          if [ "${{ steps.fastapi.outputs.mode }}" = "full" ]; then
            npx playwright test --reporter=list,html
          else
            # every spec except interop-fastapi.spec.ts (needs the sidecar) and socialcalc-ai.spec.ts (needs the UI)
            specs=()
            for f in tests/e2e/*.spec.ts; do
              [ "$f" = tests/e2e/interop-fastapi.spec.ts ] || [ "$f" = tests/e2e/socialcalc-ai.spec.ts ] || specs+=("$f")
            done
            npx playwright test --reporter=list,html "${specs[@]}"
          fi
        env:
          BASE_URL: http://localhost:8080
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() && steps.fastapi.outcome == 'success'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Show Docker Compose logs on failure
        if: failure() && steps.fastapi.outcome == 'success'
        run: docker compose logs

      - name: Stop Docker Compose
        if: always() && steps.fastapi.outcome == 'success'
        run: docker compose down
