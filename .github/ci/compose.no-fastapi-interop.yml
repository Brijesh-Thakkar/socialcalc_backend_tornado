# CI override for fork PRs only (secrets, including FASTAPI_REPO_TOKEN, are not passed to them):
# the fastapi-interop sidecar source lives in a private repo and cannot be built, so the stack
# runs without it. Removes only the fastapi-interop dependency, so it stacks with
# compose.no-node-interop.yml. Same-repo PRs and pushes always run the full stack (see e2e.yml).
services:
  fastapi-interop:
    profiles: ["fastapi-interop"]
  app1:
    depends_on:
      fastapi-interop: !reset null
  app2:
    depends_on:
      fastapi-interop: !reset null
